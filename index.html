<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%230b0e12'/%3E%3C/svg%3E">
<title>Two Rivers — India &amp; Germany</title>
<style>
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#0b0e12;font-family:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",sans-serif;}
  #app{position:fixed;inset:0;}
  canvas{display:block;}
  #panel{position:fixed;top:10px;left:10px;z-index:10;background:rgba(12,16,22,.74);backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px);
    border:1px solid rgba(255,255,255,.13);border-radius:11px;color:#ece7db;font-size:12px;width:246px;
    box-shadow:0 6px 24px rgba(0,0,0,.35);transition:opacity .25s;}
  #panel header{display:flex;justify-content:space-between;align-items:center;padding:8px 10px 6px;font-weight:600;letter-spacing:.4px;font-size:12.5px;}
  #panel header button{padding:0 7px;font-size:13px;line-height:18px;}
  #panelBody{padding:2px 10px 10px;}
  .grp{margin:7px 0;}
  .grp .lbl{opacity:.62;font-size:9.5px;text-transform:uppercase;letter-spacing:.9px;margin-bottom:4px;}
  .btnrow{display:flex;flex-wrap:wrap;gap:4px;}
  button{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);color:#ece7db;border-radius:6px;
    padding:3px 8px;font-size:11px;cursor:pointer;line-height:1.4;}
  button:hover{background:rgba(255,255,255,.19);}
  button.on{background:#d19a3f;border-color:#d19a3f;color:#181207;font-weight:600;}
  details{margin:7px 0 2px;}
  summary{cursor:pointer;opacity:.78;font-size:11px;outline:none;}
  summary:hover{opacity:1;}
  #sailRow{display:flex;gap:4px;align-items:center;}
  #sailRange{flex:1;accent-color:#d19a3f;min-width:0;}
  #hint{position:fixed;left:10px;bottom:8px;z-index:10;color:rgba(244,238,224,.62);font-size:11px;
    text-shadow:0 1px 3px rgba(0,0,0,.7);transition:opacity .25s;pointer-events:none;}
  body.photo #panel,body.photo #hint{opacity:0;pointer-events:none;}
  #panel.min #panelBody{display:none;}
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="app"></div>
<div id="panel">
  <header><span>Two Rivers · India–Germany</span><button id="btnCol" title="collapse">–</button></header>
  <div id="panelBody">
    <div class="grp"><div class="lbl">Light</div>
      <div class="btnrow" id="lightRow">
        <button data-l="0" class="on">Golden</button><button data-l="1">Dawn mist</button><button data-l="2">Moonlit</button><button data-l="3">Festival</button>
      </div>
    </div>
    <div class="grp"><div class="lbl">Quality</div>
      <div class="btnrow" id="qRow"><button data-q="2" class="on">High</button><button data-q="1">Medium</button><button data-q="0">Low</button></div>
    </div>
    <div class="grp"><div class="lbl">Crowds &amp; traffic</div>
      <div class="btnrow" id="dRow"><button data-d="0.5">Light</button><button data-d="1" class="on">Full</button><button data-d="1.7">Bustle</button></div>
    </div>
    <div class="grp"><div class="lbl">River sail</div>
      <div id="sailRow">
        <button id="btnSail" title="start river sail">▶</button>
        <button id="btnSailPlay" title="pause / play">⏸</button>
        <input id="sailRange" type="range" min="0" max="1000" value="0" title="scrub">
        <button id="btnSailExit" title="exit sail">✕</button>
      </div>
    </div>
    <details open><summary>Views</summary><div class="btnrow" id="presetRow" style="margin-top:5px"></div></details>
    <details><summary>Mirrored pairs</summary><div class="btnrow" id="pairRow" style="margin-top:5px"></div></details>
    <div class="grp btnrow" style="margin-top:9px">
      <button id="btnReset">Reset view</button><button id="btnPhoto">Photo mode</button>
    </div>
  </div>
</div>
<div id="hint">drag orbit · wheel zoom · right-drag pan · 1–4 light · space sail · H photo · R reset</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

/* ============================== utilities ============================== */
const el = id => document.getElementById(id);
const V3 = (x,y,z)=>new THREE.Vector3(x,y,z);
const clamp = (v,a,b)=> v<a?a : v>b?b : v;
const lerp = (a,b,t)=> a+(b-a)*t;
const sstep = (a,b,v)=>{ const t=clamp((v-a)/(b-a),0,1); return t*t*(3-2*t); };
function mulberry32(seed){ let a=seed>>>0; return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
const rng = mulberry32(20261121);
const rand = (a=1,b)=> b===undefined ? rng()*a : a+rng()*(b-a);
const pick = arr => arr[Math.floor(rng()*arr.length)%arr.length];
function hash2(x,y){ const s=Math.sin(x*127.1+y*311.7)*43758.5453; return s-Math.floor(s); }
function vnoise(x,y){
  const xi=Math.floor(x), yi=Math.floor(y), xf=x-xi, yf=y-yi;
  const u=xf*xf*(3-2*xf), v=yf*yf*(3-2*yf);
  return lerp(lerp(hash2(xi,yi),hash2(xi+1,yi),u), lerp(hash2(xi,yi+1),hash2(xi+1,yi+1),u), v);
}
function fbm(x,y,oct=4){ let a=0,amp=0.5,f=1; for(let i=0;i<oct;i++){ a+=amp*vnoise(x*f,y*f); amp*=0.5; f*=2.03; } return a; }
function mat4(px,py,pz,ry=0,sx=1,sy=1,sz=1,rx=0,rz=0){
  const m=new THREE.Matrix4();
  m.compose(V3(px,py,pz), new THREE.Quaternion().setFromEuler(new THREE.Euler(rx,ry,rz,'YXZ')), V3(sx,sy,sz));
  return m;
}
/* rotate-then-translate matrix for face-mounted ornament (correct order) */
const M4RT=(rot,tx,ty,tz)=>new THREE.Matrix4().multiplyMatrices(new THREE.Matrix4().makeTranslation(tx,ty,tz), rot instanceof THREE.Matrix4?rot:new THREE.Matrix4().makeRotationY(rot));
const RT=(a,tx,ty,tz)=>new THREE.Matrix4().multiplyMatrices(new THREE.Matrix4().makeTranslation(tx,ty,tz), new THREE.Matrix4().makeRotationY(a));
const gauss2=(x,z,cx,cz,amp,sig)=>{ const dx=x-cx, dz=z-cz; return amp*Math.exp(-(dx*dx+dz*dz)/(2*sig*sig)); };

/* ============================== renderer ============================== */
const renderer = new THREE.WebGLRenderer({ antialias:true, powerPreference:'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.94;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.info.autoReset=false;
el('app').appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0xf0d9b4, 0.000215);
const camera = new THREE.PerspectiveCamera(55, window.innerWidth/window.innerHeight, 0.5, 16000);
camera.position.set(-16, 19.5, -122);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.maxDistance = 7000;
controls.minDistance = 2;
controls.maxPolarAngle = Math.PI*0.66;
controls.target.set(90, 52, 250);

/* ============ the steamer deck the camera stands on ============ */
function buildDeck(){
  const d=new THREE.Group();
  const bag=new GeoBag();
  const ZR=-8.9, DECKY=-3.55;
  /* deck planks sweeping out from under the camera */
  for(let i=0;i<14;i++) bag.add(new THREE.BoxGeometry(6.4,0.12,1.02), i%2?M.wood:M.woodDark, mat4(0,DECKY,-1.4-i*1.00));
  bag.add(new THREE.BoxGeometry(6.6,0.24,15.0), M.woodDark, mat4(0,DECKY-0.18,-9.0));
  /* white bulwark across the bow, varnished cap rail */
  bag.add(new THREE.BoxGeometry(6.5,1.28,0.30), M.whitePaint, mat4(0,DECKY+0.66,ZR));
  bag.add(new THREE.BoxGeometry(6.7,0.14,0.52), M.wood, mat4(0,DECKY+1.34,ZR));
  /* side bulwarks running back past the viewer */
  for(const sx of [-1,1]) bag.add(new THREE.BoxGeometry(0.30,1.28,8.0), M.whitePaint, mat4(sx*3.15,DECKY+0.66,ZR+4.0));
  /* brass stanchions and rope rail */
  for(let i=0;i<5;i++) for(const sx of [-1,1])
    bag.add(new THREE.CylinderGeometry(0.045,0.055,1.10,6), M.gold, mat4(sx*2.95,DECKY+0.66,ZR+0.5+i*1.9));
  for(const sx of [-1,1])
    bag.add(new THREE.CylinderGeometry(0.035,0.035,7.8,5), M.gold, mat4(sx*2.95,DECKY+1.18,ZR+3.6,0,1,1,1,Math.PI/2,0));
  /* lifebuoys and a bollard */
  bag.add(new THREE.TorusGeometry(0.36,0.085,5,14), M.whitePaint, mat4(1.6,DECKY+0.72,ZR-0.18,0,1,1,1,0,0));
  bag.add(new THREE.TorusGeometry(0.36,0.085,5,14), M.roofRed, mat4(-1.6,DECKY+0.72,ZR-0.18,0,1,1,1,0,0));
  bag.add(new THREE.CylinderGeometry(0.18,0.24,0.55,10), M.woodDark, mat4(2.4,DECKY+0.28,ZR+1.6));
  bag.build(d,false);
  d.traverse(o=>{ if(o.isMesh){ o.castShadow=false; o.receiveShadow=true; o.frustumCulled=false; } });
  camera.add(d);
  scene.add(camera);
  return d;
}
const pmrem = new THREE.PMREMGenerator(renderer);
pmrem.compileEquirectangularShader();
const envTex = (()=>{
  const c=document.createElement('canvas'); c.width=256; c.height=128;
  const g=c.getContext('2d');
  const grd=g.createLinearGradient(0,0,0,128);
  grd.addColorStop(0.00,'#5d90c4'); grd.addColorStop(0.42,'#a9c6df');
  grd.addColorStop(0.50,'#f2dfc0'); grd.addColorStop(0.56,'#c8b191');
  grd.addColorStop(1.00,'#5c5344');
  g.fillStyle=grd; g.fillRect(0,0,256,128);
  const sg=g.createRadialGradient(40,60,2,40,60,46);
  sg.addColorStop(0,'rgba(255,238,205,1)'); sg.addColorStop(1,'rgba(255,220,170,0)');
  g.fillStyle=sg; g.beginPath(); g.arc(40,60,46,0,7); g.fill();
  const t=new THREE.CanvasTexture(c); t.mapping=THREE.EquirectangularReflectionMapping; t.colorSpace=THREE.SRGBColorSpace;
  return t;
})();
scene.environment = pmrem.fromEquirectangular(envTex).texture;

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 0.55, 0.42, 1.55);
composer.addPass(bloomPass);
composer.addPass(new OutputPass());

/* ============================== global state ============================== */
const state = { light:0, quality:2, density:1, photo:false,
  sail:false, sailT:0, sailPlay:false, camTween:null, fogTarget:null, fogNow:0.00016 };
const DETAIL = [];        // {obj, dist, tier} close-range ornament toggles
const MONS  = [];         // monument records {name, group, x,z}
const ANIM  = { boats:[], trains:[], birds:[], people:null, vehicles:[], smoke:[], flocks:[] };
const LIGHTS = { lamps:[], windows:[], bulbs:[] };  // materials toggled per mode

/* ============================== canvas textures ============================== */
function makeTex(w,h,fn,srgb=true){
  const c=document.createElement('canvas'); c.width=w; c.height=h;
  fn(c.getContext('2d'), w, h);
  const t=new THREE.CanvasTexture(c);
  if(srgb) t.colorSpace=THREE.SRGBColorSpace;
  t.anisotropy=4;
  return t;
}
// pierced marble lattice (jali) — opaque bars, transparent holes, used with alphaTest
const jaliTex = makeTex(128,128,(g,w,h)=>{
  g.clearRect(0,0,w,h); g.fillStyle='#efe9dc';
  const s=16;
  for(let y=0;y<h;y+=s) for(let x=0;x<w;x+=s){
    g.fillRect(x,y,s-3,s-3);
    g.clearRect(x+s*0.36, y+s*0.36, s*0.28, s*0.28);
  }
  g.fillRect(0,0,w,3); g.fillRect(0,h-3,w,3); g.fillRect(0,0,3,h); g.fillRect(w-3,0,3,h);
});
jaliTex.wrapS=jaliTex.wrapT=THREE.RepeatWrapping;
// pseudo calligraphy band (abstract strokes, no real text)
const scriptTex = makeTex(256,64,(g,w,h)=>{
  g.clearRect(0,0,w,h); g.fillStyle='#22202a';
  let x=8;
  while(x<w-8){
    const ww=3+hash2(x,3)*7, hh=14+hash2(x,7)*34;
    g.fillRect(x, h-6-hh, ww, hh);
    if(hash2(x,11)>0.55) g.fillRect(x+ww+2, h-6-hh*0.5, 2.5, 2.5);
    if(hash2(x,13)>0.6) g.beginPath(), g.arc(x+ww*0.5, h-10-hh-4, 2.2, 0, 7), g.fill();
    x+=ww+6+hash2(x,17)*10;
  }
});
scriptTex.wrapS=THREE.RepeatWrapping;
// openwork lattice for Gothic spires (cutout)
const openworkTex = makeTex(96,256,(g,w,h)=>{
  g.clearRect(0,0,w,h); g.fillStyle='#4a4642';
  g.fillRect(0,0,w,h);
  g.clearRect(0,0,w,6);
  for(let y=10;y<h-8;y+=18){
    for(let x=4;x<w-4;x+=14){
      g.save(); g.translate(x+5,y+7); g.rotate(0.6);
      g.clearRect(-4,-8,8,16); g.restore();
    }
    g.clearRect(0,y+13,w,5);
  }
});
openworkTex.wrapS=openworkTex.wrapT=THREE.RepeatWrapping;
// soft round mist / smoke blob
const blobTex = makeTex(256,128,(g,w,h)=>{
  const gr=g.createRadialGradient(w/2,h/2,4,w/2,h/2,w/2);
  gr.addColorStop(0,'rgba(255,255,255,.85)'); gr.addColorStop(0.55,'rgba(255,255,255,.32)'); gr.addColorStop(1,'rgba(255,255,255,0)');
  g.fillStyle=gr; g.fillRect(0,0,w,h);
});
// irregular cloud blob
const cloudTex = makeTex(256,256,(g,w,h)=>{
  g.clearRect(0,0,w,h);
  for(let i=0;i<18;i++){
    const x=w*0.5+(hash2(i,1)-0.5)*w*0.7, y=h*0.5+(hash2(i,2)-0.5)*h*0.45, r=14+hash2(i,3)*38;
    const gr=g.createRadialGradient(x,y,2,x,y,r);
    gr.addColorStop(0,'rgba(255,255,255,.5)'); gr.addColorStop(1,'rgba(255,255,255,0)');
    g.fillStyle=gr; g.beginPath(); g.arc(x,y,r,0,7); g.fill();
  }
});
// glass mullion grid for Elbphilharmonie
const mullionTex = makeTex(256,256,(g,w,h)=>{
  g.clearRect(0,0,w,h); g.fillStyle='rgba(235,240,244,.9)';
  for(let x=0;x<=w;x+=24) g.fillRect(x,0,2,h);
  for(let y=0;y<=h;y+=24) g.fillRect(0,y,w,2);
});
mullionTex.wrapS=mullionTex.wrapT=THREE.RepeatWrapping;

/* ============================== materials ============================== */
function std(o){ const m=new THREE.MeshStandardMaterial(o); return m; }
const M = {
  marble:      std({ color:0xe6dfd0, roughness:0.42, metalness:0.03, envMapIntensity:0.60 }),
  marbleSoft:  std({ color:0xc9c0b0, roughness:0.62, metalness:0.02, envMapIntensity:0.5 }),
  sandstone:   std({ color:0xa8533a, roughness:0.88 }),
  sandstone2:  std({ color:0xb25a3a, roughness:0.88 }),
  pinkSand:    std({ color:0xc97f68, roughness:0.85 }),
  paleSand:    std({ color:0xd8c49c, roughness:0.85 }),
  redSand:     std({ color:0x8f3f2c, roughness:0.9 }),
  darkStone:   std({ color:0x8a8073, roughness:0.92 }),
  basalt:      std({ color:0x3c3f45, roughness:0.8 }),
  brick:       std({ color:0x8a4a38, roughness:0.9 }),
  brickLight:  std({ color:0xa06a4e, roughness:0.9 }),
  slate:       std({ color:0x3d434e, roughness:0.62, metalness:0.15 }),
  copper:      std({ color:0x5f8f7a, roughness:0.45, metalness:0.65 }),
  gold:        std({ color:0xd9a83e, roughness:0.26, metalness:1.0, envMapIntensity:1.3 }),
  goldDim:     std({ color:0xb08a34, roughness:0.42, metalness:0.9 }),
  wood:        std({ color:0x6b4a33, roughness:0.85 }),
  woodDark:    std({ color:0x3f2d20, roughness:0.9 }),
  whitePaint:  std({ color:0xe9e3d6, roughness:0.8 }),
  plaster:     std({ color:0xd9cbb2, roughness:0.9 }),
  roofRed:     std({ color:0x7c4034, roughness:0.85 }),
  roofGrey:    std({ color:0x555b63, roughness:0.8 }),
  glass:       std({ color:0x9fc6da, roughness:0.12, metalness:0.85, envMapIntensity:1.4 }),
  glassWarm:   std({ color:0xd8b98a, roughness:0.2,  metalness:0.6 }),
  rock:        std({ color:0x7d776d, roughness:1.0, flatShading:true }),
  rockDark:    std({ color:0x5e594f, roughness:1.0, flatShading:true }),
  leafDark:    std({ color:0x2f5a30, roughness:0.95 }),
  leafMid:     std({ color:0x4d7a3c, roughness:0.95 }),
  leafLight:   std({ color:0x6f9448, roughness:0.95 }),
  trunk:       std({ color:0x5d4630, roughness:0.95 }),
  waterPool:   std({ color:0x2e6f86, roughness:0.08, metalness:0.35, envMapIntensity:1.5 }),
};
M.vMat   = std({ vertexColors:true, roughness:0.88, metalness:0.02 });
M.vMatRock = std({ vertexColors:true, roughness:1.0, flatShading:true });
M.jali   = std({ map:jaliTex, transparent:true, side:THREE.DoubleSide, roughness:0.5 });
M.openwork = std({ map:openworkTex, transparent:true, side:THREE.DoubleSide, roughness:0.9, alphaTest:0.35 });
M.script = std({ map:scriptTex, transparent:true, roughness:0.6 });
M.lampWarm = new THREE.MeshBasicMaterial({ color:0xffc978 });
M.windowLit = new THREE.MeshBasicMaterial({ color:0x2a3542 });
M.windowLitDay = new THREE.Color(0x2a3542);
M.windowLitNight = new THREE.Color(0xffc36a);
M.bulb = new THREE.MeshBasicMaterial({ color:0x6b5a3a });
M.bulbOn = new THREE.Color(0xffd98f);

/* ============================== geometry helpers ============================== */
class GeoBag{
  constructor(){ this.map=new Map(); }
  add(geom, mat, mtx){
    const g = geom.index ? geom.toNonIndexed() : geom.clone();
    if(mtx) g.applyMatrix4(mtx);
    let arr=this.map.get(mat); if(!arr){ arr=[]; this.map.set(mat,arr); }
    arr.push(g);
  }
  addC(geom, hex, mtx){
    const g = geom.index ? geom.toNonIndexed() : geom.clone();
    if(mtx) g.applyMatrix4(mtx);
    const col=new THREE.Color(hex); const n=g.attributes.position.count;
    const arr=new Float32Array(n*3);
    for(let i=0;i<n;i++){ arr[i*3]=col.r; arr[i*3+1]=col.g; arr[i*3+2]=col.b; }
    g.setAttribute('color', new THREE.BufferAttribute(arr,3));
    let list=this.map.get(M.vMat); if(!list){ list=[]; this.map.set(M.vMat,list); }
    list.push(g);
  }
  build(parent, shadow=true){
    const out=[];
    for(const [mat,list] of this.map){
      const merged=mergeGeometries(list,false);
      const mesh=new THREE.Mesh(merged,mat);
      mesh.castShadow=shadow; mesh.receiveShadow=true;
      parent.add(mesh); out.push(mesh);
    }
    return out;
  }
}
function archPath(w,h,s){
  const p=new THREE.Path();
  p.moveTo(-w/2,0); p.lineTo(-w/2,s);
  p.quadraticCurveTo(-w/2, s+(h-s)*0.72, 0, h);
  p.quadraticCurveTo(w/2, s+(h-s)*0.72, w/2, s);
  p.lineTo(w/2,0); p.closePath();
  return p;
}
function archShape(w,h,s){
  const sh=new THREE.Shape();
  sh.moveTo(-w/2,0); sh.lineTo(-w/2,s);
  sh.quadraticCurveTo(-w/2, s+(h-s)*0.72, 0, h);
  sh.quadraticCurveTo(w/2, s+(h-s)*0.72, w/2, s);
  sh.lineTo(w/2,0); sh.closePath();
  return sh;
}
function archGeo(w,h,s,depth){
  const g=new THREE.ExtrudeGeometry(archShape(w,h,s),{depth,bevelEnabled:false});
  g.translate(0,0,-depth/2); return g;
}
function archFrameGeo(w,h,s,depth,t){
  const sh=archShape(w,h,s);
  sh.holes.push(archPath(w-2*t, h-t*1.4, s+t*0.6));
  const g=new THREE.ExtrudeGeometry(sh,{depth,bevelEnabled:false});
  g.translate(0,0,-depth/2); return g;
}
function onionDomeGeo(r,h,seg=20){

class RiverField{
  constructor(lines,widths){
    this.cell=90; this.grid=new Map(); this.samples=[];
    lines.forEach((line,li)=>{
      for(let i=0;i<line.length-1;i++){
        const x0=line[i][0], z0=line[i][1], x1=line[i+1][0], z1=line[i+1][1];
        const len=Math.hypot(x1-x0,z1-z0), n=Math.max(1,Math.round(len/14));
        for(let j=0;j<n;j++){
          const t=j/n;
          const sx=lerp(x0,x1,t), sz=lerp(z0,z1,t);
          /* signed offset from the course: +1 east/west of the centreline */
          const sgn=(sz>=0)? 1 : ((sx>=0)?1:-1);
          this.samples.push({x:sx, z:sz, w:widths[li], side:sgn, li});
        }
      }
    });
    this.samples.forEach((s,idx)=>{
      const k=Math.floor(s.x/this.cell)+','+Math.floor(s.z/this.cell);
      let a=this.grid.get(k); if(!a){ a=[]; this.grid.set(k,a); }
      a.push(idx);
    });
  }
  /* nearest course and the signed side of it (negative = west of the course) */
  near(x,z){
    const cx=Math.floor(x/this.cell), cz=Math.floor(z/this.cell);
    let best=1e12, bw=45, bs=1;
    for(let i=-2;i<=2;i++) for(let j=-2;j<=2;j++){
      const a=this.grid.get((cx+i)+','+(cz+j)); if(!a) continue;
      for(let q=0;q<a.length;q++){
        const s=this.samples[a[q]], dx=x-s.x, dz=z-s.z, d2=dx*dx+dz*dz;
        if(d2<best){ best=d2; bw=s.w; bs=s.side; }
      }
    }
    return { d:Math.sqrt(best), w:bw, side:bs };
  }
}

const NSEG=380, HALF=5600;
const remap=u=>{ const a=Math.abs(u); return Math.sign(u)*(0.26*a+0.74*Math.pow(a,2.15))*HALF; };
/* bilinear read of the coarse terrain grid (needed by the river ribbon) */
function terrainGrid(x,z){
  const inv=v=>{
    let a=Math.abs(v)/HALF; const s=Math.sign(v)||1;
    /* invert 0.26a+0.74a^2.15 numerically - cheap, called a few thousand times */
    let lo=0, hi=1;
    a=Math.min(1,Math.max(0,a));
    for(let k=0;k<26;k++){ const mid=(lo+hi)/2; (0.26*mid+0.74*Math.pow(mid,2.15))<a ? lo=mid : hi=mid; }
    return s*(lo+hi)/2;
  };
  const u=inv(x), w=inv(z);
  const ci=clamp(Math.round((u*0.5+0.5)*NSEG),0,NSEG), cj=clamp(Math.round((w*0.5+0.5)*NSEG),0,NSEG);
  const p=TERRAIN_BASE_GRID.data;
  const r=p[cj*(NSEG+1)+ci];

function buildTerrain(){
  const g=new THREE.PlaneGeometry(2,2,NSEG,NSEG);
  g.rotateX(-Math.PI/2);
  const pos=g.attributes.position;
  for(let i=0;i<pos.count;i++){
    pos.setX(i, remap(pos.getX(i)));
    pos.setZ(i, remap(pos.getZ(i)));
  }
  /* remember the base heights: the water carve below reuses them */
  TERRAIN_BASE_GRID={ n:NSEG, data:new Float32Array(pos.count) };
  for(let i=0;i<pos.count;i++) TERRAIN_BASE_GRID.data[i]=pos.getY(i);

     dense ribbon of quads on top of it - otherwise the mesh bridges the

/* stone platform with a slight batter, optional marble rim */
function platform(bag,x,y,z,w,d,h,mat,rimMat){
  bag.add(new THREE.BoxGeometry(w,h,d), mat, mat4(x,y+h/2,z));
  if(rimMat) bag.add(new THREE.BoxGeometry(w+0.9,h*0.28,d+0.9), rimMat, mat4(x,y+h*0.14,z));
}
/* a row of arches: returns nothing, adds piers + arches to bag */
function arcade(bag,x,y,z,w,h,n,depth,mat,archMat,axis){
  const step=w/n;
  for(let i=0;i<=n;i++){
    const p=-w/2+i*step;
    const px = axis==='x' ? x+p : x;
    const pz = axis==='x' ? z : z+p;
    bag.add(new THREE.BoxGeometry(axis==='x'?step*0.3:depth*1.1, h, axis==='x'?depth*1.1:step*0.3), mat, mat4(px,y+h/2,pz));
  }
  for(let i=0;i<n;i++){
    const p=-w/2+(i+0.5)*step;
    const px = axis==='x' ? x+p : x;
    const pz = axis==='x' ? z : z+p;
    const m=mat4(px,y,pz, axis==='x'?0:Math.PI/2);
    bag.add(archFrameGeo(step*0.86,h*0.8,h*0.34,depth*0.5,step*0.09), archMat||mat, m);
  }
}

function buildTaj(){

  for(let k=0;k<4;k++)
    bag.add(new THREE.BoxGeometry(122,5.2,108), k===0?M.paleSand:M.sandstone, mat4(0,-2.6-k*5.2,0));
  /* shallow arched niches along the river face of the revetment */
  for(let k=-4;k<=4;k++){
    const zz=56;
    bag.add(archFrameGeo(9,7.0,1.4,1.0,0.7), M.paleSand, mat4(k*12,-6.0,zz));
    bag.add(new THREE.PlaneGeometry(7.4,5.6), M.woodDark, mat4(k*12,-6.4,zz-0.1));
  }
  /* riverfront apron and ghat steps down to the water */
  bag.add(new THREE.BoxGeometry(150,1.2,34), M.paleSand, mat4(0,-0.4,70));
  for(let k=0;k<7;k++)
    bag.add(new THREE.BoxGeometry(26-k*1.2,1.0,3.2), M.paleSand, mat4(0,-0.6-k*1.0,88+k*3.0));
  platform(bag,0,3.2,0, 104,92,1.5, MB);
  /* stepped plinth (takhtgah) */
  platform(bag,0,4.7,0, 92,82,2.0, MB);
  platform(bag,0,6.7,0, 88,78,1.4, MB, M.marbleSoft);
  const PY=8.1;                       // main terrace level
  /* --- lower storey block (7 bays wide, 15 deep) --- */
  const BW=56, BD=56, BH=22;
  const body=new THREE.BoxGeometry(BW,BH,BD);
  bag.add(body, MB, mat4(0,PY+BH/2,0));
  /* recessed corners: chamfer strips */
  for(const sx of [-1,1]) for(const sz of [-1,1]){
    bag.add(new THREE.BoxGeometry(9,BH,9), MB, mat4(sx*(BW/2-3.2), PY+BH/2, sz*(BD/2-3.2), Math.PI/4));
  }
  /* mouldings */
  bag.add(new THREE.BoxGeometry(BW+2.2,1.3,BD+2.2), M.marbleSoft, mat4(0,PY+0.7,0));
  bag.add(new THREE.BoxGeometry(BW+1.6,0.9,BD+1.6), M.marbleSoft, mat4(0,PY+BH-0.5,0));
  bag.add(new THREE.BoxGeometry(BW+2.8,0.5,BD+2.8), MB, mat4(0,PY+BH-1.6,0));
  /* pishtaq iwans: big arched portals, one per face */
  const iwanW=22, iwanH=20;
  for(let k=0;k<4;k++){
    const a=k*Math.PI/2;
    const m=new THREE.Matrix4().makeRotationY(a);
    const off=new THREE.Matrix4().makeTranslation(0, PY, BD/2+0.1);
    const frame=new THREE.Matrix4().multiplyMatrices(m,off);
    bag.add(archFrameGeo(iwanW+7, iwanH+4.4, 9.5, 2.6, 2.0), MB, new THREE.Matrix4().multiplyMatrices(frame,new THREE.Matrix4().makeTranslation(0,0,0)));
    /* recessed arch interior: darker marble in shade */
    bag.add(archGeo(iwanW, iwanH, 8.5, 3.2), M.marbleSoft, new THREE.Matrix4().multiplyMatrices(frame,new THREE.Matrix4().makeTranslation(0,0,-1.2)));
    /* side arcades flanking the iwan */
    for(const sd of [-1,1]){
      const px=sd*(iwanW/2+3.4);
      bag.add(archFrameGeo(9.2, iwanH*0.74, 5.2, 1.6, 1.1), MB,
        new THREE.Matrix4().multiplyMatrices(M4RT(m,px,PY,BD/2+0.1),new THREE.Matrix4()));
    }
    /* calligraphy band above the iwan (abstract strokes, wraps the portal) */
    const bandMat=M.script;
    bag.add(new THREE.PlaneGeometry(iwanW+6.4, 2.5), bandMat,
      M4RT(m,0, PY+iwanH+5.0, BD/2+2.0));
  }
  /* --- upper storey --- */
  const UY=PY+BH+0.4, UW=44, UD=44, UH=9.5;
  bag.add(new THREE.BoxGeometry(UW,UH,UD), MB, mat4(0,UY+UH/2,0));
  bag.add(new THREE.BoxGeometry(UW+1.4,0.7,UD+1.4), M.marbleSoft, mat4(0,UY+UH-0.35,0));
  for(let k=0;k<4;k++){
    const a=k*Math.PI/2;
    const m=new THREE.Matrix4().makeRotationY(a);
    bag.add(archFrameGeo(15,9.2,4.2,1.4,1.0), MB,
      M4RT(m,0,UY,UD/2+0.05));
    for(const sd of [-1,1]){
      bag.add(archFrameGeo(5.4,6.2,2.9,1.0,0.7), MB,
        M4RT(m,sd*11,UY,UD/2+0.05));
    }
    bag.add(new THREE.PlaneGeometry(UW*0.86,1.7), M.script,
      M4RT(m,0,UY+UY*0+7.4,UD/2+0.62));
  }
  /* chamfered corner octagons of upper storey */
  for(const sx of [-1,1]) for(const sz of [-1,1]){
    bag.add(new THREE.CylinderGeometry(5.6,5.6,UH,8), MB, mat4(sx*(UW/2-1.6),UY+UH/2,sz*(UD/2-1.6)));
  }
  /* --- main dome: bulbous double dome on a high drum --- */
  const DY=UY+UH+0.6;
  bag.add(new THREE.CylinderGeometry(16.6,17.4,7.4,32), MB, mat4(0,DY+3.7,0));
  /* drum windows */
  for(let i=0;i<24;i++){
    const a=i/24*Math.PI*2;
    bag.add(archFrameGeo(2.5,3.8,1.8,0.7,0.35), M.marbleSoft, mat4(Math.cos(a)*16.9, DY+0.9, Math.sin(a)*16.9, -a+Math.PI/2));
  }
  const domeR=20.4, domeH=25.0;
  bag.add(onionDomeGeo(domeR, domeH, 40), MB, mat4(0,DY+7.2,0));
  /* inner shell (visible through the double-dome gap on the river side is subtle; keep for silhouette) */
  bag.add(new THREE.SphereGeometry(domeR*0.8, 24, 12, 0, Math.PI*2, 0, Math.PI*0.5), M.marbleSoft, mat4(0,DY+7.4,0));
  /* dome ribs: thin raised ridges */
  for(let i=0;i<16;i++){
    const a=i/16*Math.PI*2;
    const rib=new THREE.CylinderGeometry(0.22,0.34,domeH*0.94,5);
    bag.add(rib, M.marbleSoft, mat4(Math.cos(a)*domeR*0.36, DY+7.2+domeH*0.47, Math.sin(a)*domeR*0.36, 0, 1,1,1, Math.sin(a)*0.0, 0));
  }
  /* golden finial */
  const finY=DY+7.2+domeH*0.985;
  bag.add(finialGeo(11.5), M.gold, mat4(0,finY,0));
  bag.add(new THREE.SphereGeometry(1.15,12,8), M.gold, mat4(0,finY+8.0,0));
  /* --- four kiosks (chhatris) around the dome --- */
  for(const sx of [-1,1]) for(const sz of [-1,1]){
    addChhatri(bag, sx*17.5, DY+0.2, sz*17.5, 4.4, MB, MB);
  }
  /* --- four minarets, leaning slightly outward --- */
  const minH=48, minR=3.5;
  const minr=[[0,3.5],[0.22,3.25],[0.24,3.3],[0.46,3.05],[0.48,3.1],[0.72,2.9],[0.74,2.95],[0.9,2.72],[0.92,2.78],[1,2.6]];
  for(const sx of [-1,1]) for(const sz of [-1,1]){
    const bx=sx*(BW/2+5.0), bz=sz*(BD/2+5.0);
    const lean=0.016;
    const grpM=new THREE.Matrix4().compose(
      V3(bx,PY,bz),
      new THREE.Quaternion().setFromEuler(new THREE.Euler(-sz*lean,0,sx*lean,'XYZ')),
      V3(1,1,1));
    /* build minaret parts into a temporary bag then bake with group matrix */
    const mb=new GeoBag();
    let y=0;
    for(let i=0;i<minr.length-1;i+=2){
      const y0=minr[i][0]*minH, r0=minr[i][1], y1=minr[i+1][0]*minH, r1=minr[i+1][1];
      mb.add(new THREE.CylinderGeometry(r1,r0,y1-y0,18), MB, mat4(0,y0+(y1-y0)/2,0));
      if(i+2<minr.length){
        mb.add(new THREE.CylinderGeometry(r0*1.5,r0*1.5,0.9,18), M.marbleSoft, mat4(0,y1+0.45,0));
        /* balcony railing */
        for(let q=0;q<16;q++){
          const a=q/16*Math.PI*2;
          mb.add(new THREE.BoxGeometry(0.22,1.5,0.22), M.marbleSoft, mat4(Math.cos(a)*r0*1.42, y1+1.65, Math.sin(a)*r0*1.42));
        }
        mb.add(new THREE.TorusGeometry(r0*1.42,0.11,4,20), M.marbleSoft, mat4(0,y1+2.4,0,0,1,1,1,Math.PI/2,0));
      }
      y=y1;
    }
    mb.add(new THREE.CylinderGeometry(3.9,3.9,1.2,18), M.marbleSoft, mat4(0,minH+0.6,0));
    mb.add(onionDomeGeo(3.9,4.4,16), MB, mat4(0,minH+1.2,0));
    mb.add(finialGeo(3.4), M.gold, mat4(0,minH+5.3,0));
    for(const [mat,list] of mb.map){
      const merged=mergeGeometries(list,false);
      merged.applyMatrix4(grpM);
      bag.add(merged, mat);
    }
  }
  /* --- jali screens: pierced marble windows in the chamfered corners --- */
  const jaliMat=M.jali;
  for(const sx of [-1,1]) for(const sz of [-1,1]){
    for(let lvl=0;lvl<2;lvl++){
      const yy=PY+6+lvl*10.5;
      bag.add(new THREE.PlaneGeometry(7.6,8.2), jaliMat,
        mat4(sx*(BW/2-5.5), yy+4.1, sz*(BD/2+0.7), sx*sz>0? Math.PI/2:-Math.PI/2));
      bag.add(archFrameGeo(9.0,9.6,4.4,0.7,0.5), M.darkStone,
        mat4(sx*(BW/2-5.5), yy, sz*(BD/2+0.5), sx*sz>0? Math.PI/2:-Math.PI/2));
    }
  }
  /* inlaid dado band: dark pietra dura strip at eye height */
  for(let k=0;k<4;k++){
    const a=k*Math.PI/2;
    const m=new THREE.Matrix4().makeRotationY(a);
    bag.add(new THREE.PlaneGeometry(BW-2, 3.2), M.script,
      M4RT(m,0,PY+3.4,BD/2+0.62));
  }
  bag.build(g);
  /* wet marble sheen helper: subtle specular plane across the plinth */
  rec.ornament.push({obj:g, tier:2});
  return rec;
}

let lastT=performance.now(), fpsAcc=0, fpsN=0;
function tick(now){
  const rawDt=Math.min(0.5,(now-lastT)/1000);
  const dt=Math.min(0.06,rawDt); lastT=now;
  const t=now*0.001;
  fpsAcc+=dt; fpsN++;
  if(fpsN>=12){ window.__stats={fps:Math.round(fpsN/fpsAcc), tris:renderer.info.render.triangles, calls:renderer.info.render.calls}; fpsAcc=0; fpsN=0; }
  waterUni.uTime.value=t; skyUni.uTime.value=t;
  for(const m of mists){
    m.m.position.y=m.base+Math.sin(t*0.3+m.ph)*1.4;
    m.m.position.x+=Math.sin(t*0.1+m.ph)*0.02;
    /* never let a mist sheet swallow the camera (sail mode sits low over water) */
    const d=m.m.position.distanceTo(camera.position);
    const fade=Math.min(1, Math.max(0, (d-90)/220));
    m.m.material.opacity=(m.m.material.userData.base||0.03)*fade;
  }
  for(const c of cloudShadows){ c.m.position.x+=c.sp*0.06; if(c.m.position.x>2600) c.m.position.x=-2600; }
  updateBoats(dt,t);
  updatePeople(dt,t);
  updateBirds(t);
  updateVehicles(dt);
  updateTrains(dt,t);
  if(DECK_GROUP) DECK_GROUP.visible = (!state.sail) && camera.position.distanceTo(HERO_POS) < 30;
  stepTween(rawDt);
  updateSail(dt);
  if(sbT>0){ sbT=Math.max(0,sbT-dt); renderer.toneMappingExposure*= (1- sbT*0.10); }
  const f=controls.target;
  sun.target.position.copy(f);
  sun.position.copy(f).addScaledVector(SUN_DIR,2400);
  sun.target.updateMatrixWorld();
  controls.update();
  renderer.info.reset();
  composer.render();
  requestAnimationFrame(tick);
}

/* ============================== shared facade helpers ============================== */
/* grid of windows as instanced-ish merged quads sunk into a wall */
function addWindowGrid(bag, x0,y0,z0, cols,rows, dx,dy, wz,wy, rotY, mat){
  const m0=new THREE.Matrix4().makeRotationY(rotY);
  for(let c=0;c<cols;c++) for(let r=0;r<rows;r++){
    const lx=(c-(cols-1)/2)*dx, ly=y0+r*dy;
    const m=new THREE.Matrix4().multiplyMatrices(m0,new THREE.Matrix4().makeTranslation(lx,ly,z0));
    bag.add(new THREE.PlaneGeometry(wz,wy), mat, m);
  }
}
/* parapet / crenellation run */
function crenels(bag, len, y, z, mat, axis, x, step, h){
  step=step||3.2; h=h||1.6;
  const n=Math.floor(len/step);
  for(let i=0;i<n;i+=2){
    const p=-len/2+i*step+step/2;
    if(axis==='z') bag.add(new THREE.BoxGeometry(1.9,h,1.4), mat, mat4(x, y+h/2, z+p));
    else bag.add(new THREE.BoxGeometry(step*0.9,h,1.4), mat, mat4(x+p, y+h/2, z));
  }
}
/* hipped / gambrel roof prism */
function roofGeo(w,d,h,type){
  if(type==='hip'){
    const g=new THREE.ConeGeometry(Math.max(w,d)*0.72,h,4,1);
    g.rotateY(Math.PI/4); g.scale(w/Math.max(w,d),1,d/Math.max(w,d));
    return g;
  }
  const g=new THREE.CylinderGeometry(0.001,1,1,3,1);
  return g;
}
/* tiled pitched roof (two slopes) */
function pitchRoof(bag, w,d,h, mat, x,y,z, rotY){
  const half=d/2;
  const sh=new THREE.Shape(); sh.moveTo(-half,0); sh.lineTo(0,h); sh.lineTo(half,0); sh.closePath();
  const g=new THREE.ExtrudeGeometry(sh,{depth:w,bevelEnabled:false});
  g.rotateY(Math.PI/2); g.translate(-w/2,0,0);
  bag.add(g, mat, mat4(x,y,z, rotY||0));
}

/* ============================== 1. RED FORT ============================== */
function buildRedFort(){
  const {g,rec}=newMon('redfort', -Math.PI/2);
  const bag=new GeoBag();
  const RS=M.sandstone, RS2=M.sandstone2;
  /* ramparts: long curtain walls with battered base */
  const wallH=22, wallT=9;
  const plan=[[0,0,150,0],[0,0,150,0]];
  /* river face */
  bag.add(new THREE.BoxGeometry(150,wallH,wallT), RS, mat4(0,wallH/2,26));
  bag.add(new THREE.BoxGeometry(150,3.4,wallT+2.4), M.redSand, mat4(0,1.7,26));
  crenels(bag,150,wallH,26,RS2,'x',0,3.4,2.2);
  /* bastion towers */
  for(let i=-2;i<=2;i++){
    const bx=i*34;
    bag.add(new THREE.CylinderGeometry(8.5,9.6,wallH+5,14), RS, mat4(bx, (wallH+5)/2, 26));
    bag.add(new THREE.CylinderGeometry(9.6,9.6,1.2,14), RS2, mat4(bx, wallH+5.4, 26));
    for(let q=0;q<10;q++){ const a=q/10*Math.PI*2; bag.add(new THREE.BoxGeometry(1.6,2.2,1.2), RS2, mat4(bx+Math.cos(a)*9.2, wallH+5.8, 26+Math.sin(a)*9.2, -a)); }
  }
  /* return walls */
  for(const sx of [-1,1]){
    bag.add(new THREE.BoxGeometry(wallT,wallH,66), RS, mat4(sx*72,wallH/2,-7));
    crenels(bag,66,wallH,-7,RS2,'z',sx*72,3.4,2.2);
  }
  /* water gate + ghat steps down to the river */
  bag.add(new THREE.BoxGeometry(26,8,7), RS2, mat4(4,4,32));
  bag.add(archFrameGeo(11,9,4,3,1.1), M.marbleSoft, mat4(4,3.2,34));
  for(let i=0;i<7;i++) bag.add(new THREE.BoxGeometry(30,0.85,3.2), M.paleSand, mat4(4, -0.4-i*0.55, 40+i*3.0));
  /* Lahori-style gate: massive arched portal with a row of kiosks */
  bag.add(new THREE.BoxGeometry(38,24,14), RS, mat4(-34,12,22));
  bag.add(archFrameGeo(15,15,7,3.4,2.0), M.redSand, mat4(-34,0,30));
  bag.add(new THREE.BoxGeometry(42,2.2,17), RS2, mat4(-34,24.2,22));
  for(const bx of [-13,-4.4,4.4,13]) addChhatri(bag, -34+bx, 25.4, 22, 2.0, M.marbleSoft, M.marbleSoft);
  /* marble pavilions (Diwan-i-Khas) along the river side */
  for(const px of [24,42]){
    bag.add(new THREE.BoxGeometry(15,10,13), M.marble, mat4(px,wallH+5,0));
    for(const cx of [-5.4,0,5.4]) for(const cz of [-4.6,4.6])
      bag.add(columnGeo(0.42,5.4), M.marble, mat4(px+cx,wallH+10,cz));
    bag.add(new THREE.BoxGeometry(17,1.1,15), M.marble, mat4(px,wallH+16,0));
    addChhatri(bag, px, wallH+16.4, 0, 2.4, M.marble, M.marble);
    bag.add(new THREE.PlaneGeometry(11,3.0), M.jali, mat4(px,wallH+12.5,6.7));
  }
  /* inner court: arcaded hall visible over the wall */
  for(let i=0;i<10;i++) bag.add(new THREE.BoxGeometry(4.4,12,4.4), M.marbleSoft, mat4(-20+i*9, wallH+6, -30));
  bag.add(new THREE.BoxGeometry(96,2.0,6), M.marble, mat4(20, wallH+13, -30));
  addWindowGrid(bag, 0, 6, 30.6, 12,2, 10, 6.4, 1.5,3.0, 0, M.windowLit);
  bag.build(g);
  rec.ornament.push({obj:g,tier:2});
  return rec;
}

/* ============================== 2. QUTUB MINAR ============================== */
function buildQutub(){
  const {g,rec}=newMon('qutub', -Math.PI/2);
  const bag=new GeoBag();
  const RS=M.sandstone, MB=M.marble;
  /* five storeys, alternating fluting, tapering, projecting balconies */
  const storeys=[
    {h:14.0, r0:7.4, r1:6.5, fl:24, mat:RS,  bal:true},
    {h:12.5, r0:6.2, r1:5.3, fl:0,  mat:RS,  bal:true},
    {h:11.0, r0:5.1, r1:4.4, fl:24, mat:RS,  bal:true},
    {h:9.0,  r0:4.2, r1:3.6, fl:0,  mat:MB,  bal:true},
    {h:7.5,  r0:3.4, r1:2.9, fl:24, mat:MB,  bal:true},
  ];
  let y=4.4;
  bag.add(new THREE.CylinderGeometry(9.6,10.6,4.4,28), M.redSand, mat4(0,2.2,0));
  bag.add(new THREE.CylinderGeometry(11.6,12.2,1.6,28), RS, mat4(0,0.8,0));
  for(const s of storeys){
    const geo = s.fl ? flutedCylinder(s.r1,s.r0,s.h,s.fl,0.075) : new THREE.CylinderGeometry(s.r1,s.r0,s.h,28);
    bag.add(geo, s.mat, mat4(0,y+s.h/2,0));
    /* inscription bands */
    for(const f of [0.22,0.62]){
      bag.add(new THREE.CylinderGeometry(lerp(s.r0,s.r1,f)+0.16, lerp(s.r0,s.r1,f)+0.16, 0.85, 28), s.mat===RS?MB:RS, mat4(0,y+s.h*f,0));
    }
    y+=s.h;
    /* balcony with railing */
    if(s.bal){
      bag.add(new THREE.CylinderGeometry(s.r1+1.7, s.r1+1.7, 0.75, 30), MB, mat4(0,y+0.35,0));
      for(let q=0;q<26;q++){ const a=q/26*Math.PI*2; bag.add(new THREE.BoxGeometry(0.2,1.4,0.2), MB, mat4(Math.cos(a)*(s.r1+1.45), y+1.4, Math.sin(a)*(s.r1+1.45))); }
      bag.add(new THREE.TorusGeometry(s.r1+1.45,0.11,4,32), MB, mat4(0,y+2.1,0,0,1,1,1,Math.PI/2,0));
    }
  }
  /* top: cupola + finial */
  bag.add(new THREE.CylinderGeometry(3.5,3.9,1.1,18), MB, mat4(0,y+0.55,0));
  bag.add(onionDomeGeo(3.5,4.2,18), RS, mat4(0,y+1.1,0));
  bag.add(finialGeo(4.6), M.goldDim, mat4(0,y+5.0,0));
  /* the plain Alai Minar stump and arcaded ruins around */
  bag.add(new THREE.CylinderGeometry(11,12,18,20), RS, mat4(-46,-2,-40));
  for(let i=0;i<12;i++){
    const a=i/12*Math.PI*2;
    const px=Math.cos(a)*44, pz=Math.sin(a)*40;
    const hh=4+hash2(i,3)*7;
    for(let c=0;c<3;c++){
      bag.add(new THREE.BoxGeometry(1.3,hh,1.3), RS, mat4(px+Math.cos(a)*c*3.2, hh/2-1, pz+Math.sin(a)*c*3.2));
    }
    bag.add(new THREE.BoxGeometry(9,1.1,1.6), RS, mat4(px+Math.cos(a)*3.2, hh-0.6, pz+Math.sin(a)*3.2, -a));
    for(let c=0;c<2;c++) bag.add(archFrameGeo(4.4,hh*0.8,2,0.7,0.45), RS, mat4(px+Math.cos(a)*(c*3.2+1.6), -1, pz+Math.sin(a)*(c*3.2+1.6), -a+Math.PI/2));
  }
  /* Iron Pillar in the courtyard */
  bag.add(new THREE.CylinderGeometry(0.28,0.32,7.2,10), M.basalt, mat4(20,2.6,20));
  bag.build(g);
  rec.ornament.push({obj:g,tier:2});
  return rec;
}

/* ============================== 3. GOLDEN TEMPLE ============================== */
function buildGolden(){
  const {g,rec}=newMon('golden', -Math.PI/2);
  const bag=new GeoBag();
  const MB=M.marble;
  /* marble surround + sacred pool (square, lower than ground) */
  bag.add(new THREE.BoxGeometry(120,1.2,120), M.marbleSoft, mat4(0,0.2,0));
  /* pool basin walls */
  for(const [px,pz,w,d] of [[0,52,100,5],[0,-52,100,5],[52,0,5,100],[-52,0,5,100]]){
    bag.add(new THREE.BoxGeometry(w,2.4,d), MB, mat4(px,0.7,pz));
  }
  /* causeway to the sanctum */
  bag.add(new THREE.BoxGeometry(7,1.0,46), MB, mat4(0,1.5,26));
  bag.add(new THREE.BoxGeometry(7,0.9,46), M.goldDim, mat4(0,2.1,26));
  /* gilded sanctum (Harmandir Sahib): lower marble storey, gilded upper with dome */
  bag.add(new THREE.BoxGeometry(26,7,26), MB, mat4(0,4.5,0));
  bag.add(new THREE.BoxGeometry(24,1.1,24), M.marbleSoft, mat4(0,8.5,0));
  bag.add(new THREE.BoxGeometry(22,9,22), M.gold, mat4(0,13,0));
  /* corner pavilions */
  for(const sx of [-1,1]) for(const sz of [-1,1]){
    bag.add(new THREE.BoxGeometry(5,11,5), M.gold, mat4(sx*11,14.4,sz*11));
    bag.add(onionDomeGeo(3.4,4.0,16), M.gold, mat4(sx*11,19.6,sz*11));
    bag.add(finialGeo(3.0), M.gold, mat4(sx*11,23.4,sz*11));
  }
  /* main dome + small kiosks */
  bag.add(new THREE.CylinderGeometry(9.0,9.6,4.0,24), M.gold, mat4(0,19.5,0));
  bag.add(onionDomeGeo(10.2,10.4,28), M.gold, mat4(0,23.4,0));
  bag.add(finialGeo(6.0), M.gold, mat4(0,33.2,0));
  for(const sx of [-1,1]){
    addChhatri(bag, sx*9.5, 22.4, 0, 1.9, M.gold, M.gold);
  }
  /* arched openings, gilded frames, dark shaded interiors */
  for(let k=0;k<4;k++){
    const m=new THREE.Matrix4().makeRotationY(k*Math.PI/2);
    bag.add(archFrameGeo(8.2,8.0,3.4,1.5,0.7), M.goldDim,
      M4RT(m,0,9.0,11.2));
    bag.add(archGeo(6.6,6.8,2.8,1.0), M.woodDark,
      M4RT(m,0,9.0,11.5));
    bag.add(new THREE.PlaneGeometry(16,2.2), M.script,
      M4RT(m,0,16.6,11.3));
  }
  /* marble perimeter arcade with domed corner towers, and the clock-tower gate behind */
  for(let i=0;i<40;i++){
    const a=i/40*Math.PI*2;
    const r=57;
    const px=Math.cos(a)*r, pz=Math.sin(a)*r;
    if(Math.abs(px)<26 && pz>40) continue;    // entrance gap
    bag.add(new THREE.BoxGeometry(2.0,8,2.0), MB, mat4(px,4,pz,-a));
    if(i%2===0) bag.add(new THREE.BoxGeometry(2.2,1.0,2.2), M.marbleSoft, mat4(px,8.4,pz,-a));
  }
  for(const sx of [-1,1]) for(const sz of [-1,1]){
    bag.add(new THREE.BoxGeometry(9,16,9), MB, mat4(sx*56,8,sz*56));
    bag.add(onionDomeGeo(4.4,5.0,14), M.marbleSoft, mat4(sx*56,16.4,sz*56));
  }
  bag.build(g);
  rec.ornament.push({obj:g,tier:2});
  return rec;
}

/* ============================== 4. KONARK ============================== */
function buildKonark(){
  const {g,rec}=newMon('konark', -Math.PI/2);
  const bag=new GeoBag();
  const ST=M.darkStone, ST2=M.rock;
  /* jagamohana (audience hall): tiered pyramidal roof, weathered */
  bag.add(new THREE.BoxGeometry(34,9,34), ST, mat4(0,4.5,-6));
  bag.add(new THREE.BoxGeometry(36,1.0,36), ST2, mat4(0,9.2,-6));
  for(let t=0;t<3;t++){
    const s=31-t*7.5, yy=9.7+t*5.4;
    bag.add(new THREE.BoxGeometry(s,s,5.4), ST, mat4(0,yy+2.7,-6));
    bag.add(new THREE.BoxGeometry(s-1.2,s-1.2,1.0), ST2, mat4(0,yy+5.2,-6));
  }
  bag.add(new THREE.CylinderGeometry(3.6,4.2,2.4,16), ST, mat4(0,26.6,-6));
  bag.add(onionDomeGeo(4.0,4.4,16), ST2, mat4(0,28.6,-6));
  /* the chariot platform with 24 carved wheels */
  bag.add(new THREE.BoxGeometry(40,10,46), ST, mat4(0,5,20));
  for(const sx of [-1,1]) for(let i=0;i<12;i++){
    const wz=-8+i*4.2;
    const wheel=new THREE.TorusGeometry(2.5,0.55,6,18);
    bag.add(wheel, ST2, mat4(sx*20.4, 4.6, wz, Math.PI/2));
    for(let k=0;k<8;k++){ const a=k/8*Math.PI*2;
      bag.add(new THREE.BoxGeometry(0.22,4.2,0.22), ST2, mat4(sx*20.4+Math.sin(a)*0.0, 4.6+Math.cos(a)*2.0, wz+Math.sin(a)*2.0, 0));
    }
  }
  /* seven horses in front, worn and broken */
  for(let i=0;i<7;i++){
    const px=-19+i*6.4, hh=4.2+hash2(i,4)*1.4;
    bag.add(new THREE.BoxGeometry(2.2,hh,6.0), ST, mat4(px,hh/2,45));
    bag.add(new THREE.BoxGeometry(1.7,2.2,2.4), ST, mat4(px,hh+0.9,47.2,0,1,1,1,-0.2));
    bag.add(new THREE.BoxGeometry(2.4,1.2,1.8), ST2, mat4(px,hh+2.2,46.6));
    for(const lz of [43.4,47.6]) for(const lx of [-0.7,0.7]) bag.add(new THREE.BoxGeometry(0.5,hh,0.5), ST, mat4(px+lx,hh/2,lz));
    if(i===3) bag.add(new THREE.BoxGeometry(2.2,hh*0.5,6.0), ST, mat4(px,-1,45));  // ruined
  }
  /* carved base friezes */
  for(let i=0;i<40;i++){
    bag.add(new THREE.BoxGeometry(0.9,2.2,0.5), ST2, mat4(-20+i*1.0, 2.2, 43.2));
  }
  addWindowGrid(bag, 0, 2.0, 11.1, 6, 2, 5.2, 3.4, 2.2, 3.0, 0, M.windowLit);
  bag.build(g);
  rec.ornament.push({obj:g,tier:2});
  return rec;
}

/* ============================== 5. COLOGNE CATHEDRAL ============================== */
function buildCologne(){
  const {g,rec}=newMon('cologne', -Math.PI/2);
  const bag=new GeoBag();
  const DK=M.darkStone;
  /* nave body */
  bag.add(new THREE.BoxGeometry(42,48,86), DK, mat4(0,24,0));
  pitchRoof(bag, 42, 88, 12, M.slate, 0, 48, 0);
  /* twin west towers: square shafts to 100m, then openwork spires */
  for(const sx of [-1,1]){
    const bx=sx*15;
    bag.add(new THREE.BoxGeometry(17,100,17), DK, mat4(bx,50,43));
    /* buttress corners */
    for(const cx of [-1,1]) for(const cz of [-1,1])
      bag.add(new THREE.BoxGeometry(3.2,100,3.2), DK, mat4(bx+cx*8.4,50,43+cz*8.4));
    /* belfry stage with tall lancets */
    bag.add(new THREE.BoxGeometry(15,22,15), DK, mat4(bx,105,43));
    for(let k=0;k<4;k++){
      const m=M4RT(new THREE.Matrix4().makeRotationY(k*Math.PI/2),bx,92,43+7.6);
      bag.add(new THREE.PlaneGeometry(11,18), M.openwork, m);
    }
    for(let k=0;k<4;k++){
      const m=M4RT(new THREE.Matrix4().makeRotationY(k*Math.PI/2),bx,106,43+7.7);
      bag.add(new THREE.PlaneGeometry(9.6,15), M.openwork, m);
    }
    /* openwork octagonal spire to 157m */
    const sp=new THREE.ConeGeometry(9.0,38,8,3,true);
    bag.add(sp, M.openwork, mat4(bx, 116+19, 43));
    bag.add(new THREE.ConeGeometry(8.4,37.4,8,1,true), DK, mat4(bx,116+18.7,43));
    bag.add(new THREE.CylinderGeometry(0.5,0.9,5.0,8), M.goldDim, mat4(bx,157.5,43));
    /* corner pinnacles on the tower */
    for(const cx of [-1,1]) for(const cz of [-1,1]){
      bag.add(new THREE.ConeGeometry(1.5,11,6), DK, mat4(bx+cx*8.4, 121.5, 43+cz*8.4));
    }
    /* flying buttresses along the nave */
    for(let i=0;i<5;i++){
      const z=-38+i*19;
      bag.add(new THREE.BoxGeometry(2.2,30,3.0), DK, mat4(bx-sx*0.0,15,z));
      const fb=new THREE.BoxGeometry(16,2.2,2.4);
      fb.rotateZ(sx*0.22);
      bag.add(fb, DK, mat4(sx*25,38,z));
    }
  }
  /* clerestory windows + buttress rhythm along both flanks */
  for(const sx of [-1,1]){
    for(let i=0;i<7;i++){
      const z=-34+i*13.5;
      bag.add(new THREE.PlaneGeometry(6.4,16), M.windowLit, mat4(sx*21.2,30,z, sx*Math.PI/2));
      bag.add(archFrameGeo(7.6,17.4,9,0.9,0.7), M.paleSand, mat4(sx*21.1,21.6,z, sx*Math.PI/2));
      bag.add(new THREE.BoxGeometry(2.6,40,2.0), DK, mat4(sx*22.6,20,z+6.7));
      /* flying buttress */
      const fbg=new THREE.BoxGeometry(9,1.6,1.6); fbg.rotateZ(sx*0.5);
      bag.add(fbg, DK, mat4(sx*25,42,z));
    }
  }
  /* transept + choir, apse */
  bag.add(new THREE.BoxGeometry(72,44,20), DK, mat4(0,22,-34));
  bag.add(new THREE.CylinderGeometry(15,15,44,16,1,false,0,Math.PI), DK, mat4(0,22,-44,Math.PI/2));
  /* west portal: three arched doors and rose window */
  bag.add(archFrameGeo(13,26,12,2.2,1.6), M.paleSand, mat4(0,0,52.2));
  addWindowGrid(bag, 0, 30, 52.4, 1,1, 0,0, 20, 20, 0, M.glass);
  for(const sx of [-1,1]) bag.add(archFrameGeo(7,14,6,1.6,1.0), M.paleSand, mat4(sx*15,0,52.2));
  /* stained glass front windows */
  addWindowGrid(bag, 0, 8, 52.6, 3, 4, 12, 10, 4.0, 8.0, 0, M.windowLit);
  /* railway bridge with a train (Hochbahn) — separate animated group */
  const bridge=new THREE.Group();
  bridge.position.set(0,0,-70);
  const bb=new GeoBag();
  for(const sx of [-1,1]){
    bb.add(new THREE.BoxGeometry(4.0,7.0,124), M.darkStone, mat4(sx*34,7,0));
  }
  bb.add(new THREE.BoxGeometry(72,2.2,124), M.darkStone, mat4(0,8.5,0));
  for(let i=0;i<9;i++){
    bb.add(new THREE.BoxGeometry(72,7.6,1.4), M.slate, mat4(0,4.6,-56+i*14));
  }
  /* iron arches */
  for(let i=0;i<9;i++){
    const a=new THREE.TorusGeometry(9,0.55,4,12,Math.PI);
    bb.add(a, M.basalt, mat4(0,10.0,-56+i*14,0,1,1,1,0,0));
  }
  bb.build(bridge);
  g.add(bridge);
  /* the train itself */
  const train=new THREE.Group();
  const tb=new GeoBag();
  for(let i=0;i<7;i++){
    tb.add(new THREE.BoxGeometry(3.4,3.6,13.5), i<2?M.slate:M.copper, mat4(0,2.4,-i*15));
    tb.add(new THREE.BoxGeometry(3.0,0.5,12.8), M.roofGrey, mat4(0,4.3,-i*15));
  }
  tb.build(train,false);
  train.position.set(4,10.6,-70);
  g.add(train);
  ANIM.trains.push({obj:train, x0:4, z0:-70, axis:'z', from:-62, to:62, speed:16, phase:rand(60), len:105});
  bag.build(g);
  rec.ornament.push({obj:g,tier:2});
  return rec;
}

/* ============================== 6. NEUSCHWANSTEIN ============================== */
function buildNeuschwanstein(){
  const {g,rec}=newMon('neuschwanstein', -Math.PI/2);
  g.scale.setScalar(1.45);
  const bag=new GeoBag();
  const WH=M.marbleSoft;
  const baseY=0;                        // sits on the crag summit

/* ============ mirrored reflections of the riverside monuments ============ */
function buildMirrors(){
  const WATER_Y=0.45;
  const ids=['taj','redfort','cologne','holstentor','gateway','frauenkirche','zwinger','elphi'];
  for(const id of ids){
    const rec=MONS.find(m=>m.id===id);
    if(!rec) continue;
    const clone=rec.group.clone(true);
    clone.traverse(o=>{ if(o.isMesh){ o.castShadow=false; o.receiveShadow=false; } });
    /* mirror about the water plane: basis must be right-handed, so flip y and z */
    clone.position.y = 2*WATER_Y - rec.group.position.y;
    clone.scale.set(1,-1,-1);
    clone.renderOrder=-1;
    scene.add(clone);
  }
}

function crownGeo(kind,r){
  if(kind==='cone')  return new THREE.ConeGeometry(r, r*3.0, 6, 1);
  if(kind==='tall')  return new THREE.SphereGeometry(r,6,5).scale(1,2.4,1);
  if(kind==='wide')  return new THREE.SphereGeometry(r,7,5).scale(1.25,0.62,1.25);
  if(kind==='palm'){
    const parts=[];
    for(let i=0;i<8;i++){
      const f=new THREE.BoxGeometry(0.34,r*2.1,0.7);
      f.translate(0,r*1.0,0);
      f.rotateZ(0.85); f.rotateY(i/8*Math.PI*2);
      parts.push(f.toNonIndexed());
    }
    parts.push(new THREE.SphereGeometry(r*0.32,6,5).toNonIndexed());
    return mergeGeometries(parts,false);
  }
  return new THREE.SphereGeometry(r,7,5).scale(1,0.92,1);
}
function buildVegetation(){
  const dummy=new THREE.Object3D();
  const col=new THREE.Color();
  const built=[];
  for(const t of VEG_TYPES){
    const crownList=[], trunkList=[];
    const trunkG=new THREE.CylinderGeometry(0.26,0.42,t.trunkH,6);
    trunkG.translate(0,t.trunkH/2,0);
    const cg=crownGeo(t.crown,t.r);
    const yOff = t.crown==='cone' ? t.trunkH*0.55 : t.trunkH + (t.crown==='tall'?t.r*1.6:0);
    let placed=0, tries=0;
    const lines = t.side==='in' ? [R_INDIAN,R_SHARED] : [R_GERMAN,R_SHARED];
    while(placed<t.n && tries<t.n*14){
      tries++;
      /* groves grow along the water: pick a point on a course, step back from the bank */
      const line=lines[Math.floor(rand(lines.length))%lines.length];
      if(line.length<2) break;
      const si=Math.floor(rand(line.length-1)), tt=rand(1);
      const x0=line[si][0], z0=line[si][1], x1=line[si+1][0], z1=line[si+1][1];
      const dx=x1-x0, dz=z1-z0, dl=Math.hypot(dx,dz)||1;
      const side = (t.side==='in'?1:-1) * (rand(1)<0.72?1:-1);
      const lat = t.dmin + Math.pow(rand(1),1.7)*(t.dmax-t.dmin);
      const x = lerp(x0,x1,tt) - dz/dl*lat*side;
      const zz= lerp(z0,z1,tt) + dx/dl*lat*side;
      if(zz<140 && Math.abs(x)<170) continue;           // harbour mouth stays open
      const rn=rivers.near(x,zz);
      if(rn.d < t.dmin || rn.d > t.dmax) continue;
      const y=terrainH(x,zz);
      if(y<2.6 || y>430) continue;
      let bad=false;
      for(let si2=0;si2<SITES.length;si2++){
        const s=SITES[si2], ddx=x-s.x, ddz=zz-s.z;
        if(!s.water && ddx*ddx+ddz*ddz < (s.r*0.86)*(s.r*0.86)){ bad=true; break; }
      }
      if(bad) continue;
      const h1=terrainH(x+7,zz), h2=terrainH(x,zz+7);
      if(Math.abs(h1-y)>4.2 || Math.abs(h2-y)>4.2) continue;
      const sc=0.72+hash2(x,zz)*0.62;
      dummy.position.set(x,y-0.4,zz);
      dummy.rotation.set(0,hash2(zz,x)*6.283,0);
      dummy.scale.set(sc,sc*(0.88+hash2(x*1.7,zz)*0.34),sc);
      dummy.updateMatrix();
      trunkList.push(dummy.matrix.clone());
      dummy.position.y=y-0.4+yOff*sc;
      dummy.updateMatrix();
      crownList.push(dummy.matrix.clone());
      placed++;
    }
    if(!crownList.length) continue;
    const cm=new THREE.MeshStandardMaterial({color:0xffffff, roughness:0.95, vertexColors:false});
    const inst=new THREE.InstancedMesh(cg, cm, crownList.length);
    const im=new THREE.InstancedMesh(trunkG, M.trunk, trunkList.length);
    for(let i=0;i<crownList.length;i++){
      inst.setMatrixAt(i,crownList[i]);
      col.setHex(t.c1).lerp(new THREE.Color(t.c2), hash2(i,3));
      inst.setColorAt(i,col);
      im.setMatrixAt(i,trunkList[i]);
    }
    inst.instanceMatrix.needsUpdate=true; im.instanceMatrix.needsUpdate=true;
    if(inst.instanceColor) inst.instanceColor.needsUpdate=true;
    inst.castShadow=true; inst.receiveShadow=true; im.castShadow=false; im.receiveShadow=true;
    inst.frustumCulled=false; im.frustumCulled=false;
    scene.add(inst); scene.add(im);
    built.push({inst,im,type:t.id});
  }
  return built;
}

/* ============================== roads, quays, ghats ============================== */
function buildWays(){
  const bag=new GeoBag();
  const line=[];
  /* a road tracing each bank, ghats every hundred metres on the Indian side */
  function traceBank(poly, sideSign, width, mat, lift){
    const pts=[];
    for(let i=0;i<poly.length-1;i++){
      const [x0,z0]=poly[i], [x1,z1]=poly[i+1];
      const dx=x1-x0, dz=z1-z0, len=Math.hypot(dx,dz);
      const nx=-dz/len, nz=dx/len;
      const n=Math.max(1,Math.round(len/18));
      for(let j=0;j<n;j++){
        const t=j/n;
        pts.push([x0+dx*t+nx*sideSign*width, z0+dz*t+nz*sideSign*width]);
      }
    }
    for(let i=0;i<pts.length-1;i++){
      const [ax,az]=pts[i], [bx,bz]=pts[i+1];
      const mx=(ax+bx)/2, mz=(az+bz)/2;
      /* the embankment surface: never below the water line */
      const y=Math.max(terrainH(mx,mz), 1.1)+lift;
      const ang=Math.atan2(bx-ax, bz-az);
      const len=Math.hypot(bx-ax,bz-az);
      bag.add(new THREE.BoxGeometry(9,0.35,len*1.05), mat, mat4(mx,y,mz,ang));
      if(i%7===0) bag.add(new THREE.BoxGeometry(1.0,4.4,1.0), M.woodDark, mat4(mx+2,y+2.2,mz));
      /* stone facing on the water side so the bank reads as a quay, not a slope */
      const dl2=Math.hypot(bx-ax,bz-az)||1;
      const qx=(ax+bx)/2-(bz-az)/dl2*3.4*Math.sign(sideSign), qz=(az+bz)/2+(bx-ax)/dl2*3.4*Math.sign(sideSign);
      bag.add(new THREE.BoxGeometry(1.2,3.2,len*1.02), M.paleSand, mat4(qx, y-1.6, qz, ang));
    }
    return pts;
  }
  traceBank(R_INDIAN, 1, 78, M.paleSand, 0.4);
  traceBank(R_INDIAN, -1, 78, M.plaster, 0.4);
  traceBank(R_GERMAN, 1, 72, M.roofGrey, 0.4);
  traceBank(R_GERMAN, -1, 72, M.roofGrey, 0.4);
  traceBank(R_SHARED, 1, 84, M.plaster, 0.4);
  traceBank(R_SHARED, -1, 84, M.plaster, 0.4);
  /* ghats: stone flights down to the Indian water at intervals, hugging the bank */
  for(let i=1;i<R_INDIAN.length-1;i++){
    const [x,z]=R_INDIAN[i];
    const [nx,nz]=R_INDIAN[i+1];
    const dx=nx-x, dz=nz-z, dl=Math.hypot(dx,dz)||1;
    const ux=-dz/dl, uz=dx/dl;
    const ang=Math.atan2(dx,dz);
    for(const side of [-1,1]){
      /* start just off the water's edge and climb the bank */
      const bx=x+ux*side*18, bz=z+uz*side*18;
      const top=Math.max(terrainH(x+ux*side*40, z+uz*side*40), 2.2);
      const steps=7;
      for(let k=0;k<steps;k++){
        const px=bx+ux*side*k*1.7, pz=bz+uz*side*k*1.7;
        const y=lerp(0.35, top, k/(steps-1));
        bag.add(new THREE.BoxGeometry(19,0.5,2.0), M.paleSand, mat4(px,y,pz,ang));
      }
      /* flanking posts at the head of each flight */
      for(const s2 of [-1,1])
        bag.add(new THREE.BoxGeometry(0.9,3.0,0.9), M.paleSand,
          mat4(bx+ux*side*(steps)*1.7+Math.cos(ang)*s2*9.6, top+1.5, bz+uz*side*(steps)*1.7-Math.sin(ang)*s2*9.6));
    }

  for(const sx of [-1,1]){

      const z=-30-i*24, x=sx*(58+((i%3)*9));
      const y=terrainH(x,z);

      else { /* pretzel rack */ bag.add(new THREE.BoxGeometry(2.6,0.14,0.14), M.woodDark, mat4(x+2.2,y+1.7,z)); }

/* ============================== river courses for vessels ============================== */
function riverCurve(poly, lane, lift){
  const pts=[];
  for(let i=0;i<poly.length;i++){
    const [x,z]=poly[i];
    const prev=poly[Math.max(0,i-1)], next=poly[Math.min(poly.length-1,i+1)];
    const dx=next[0]-prev[0], dz=next[1]-prev[1], len=Math.hypot(dx,dz)||1;
    pts.push(V3(x - dz/len*lane, 0.6+(lift||0), z + dx/len*lane));
  }
  const c=new THREE.CatmullRomCurve3(pts, false, 'catmullrom', 0.4);
  return c;
}
const COURSES={
  inN: riverCurve(R_INDIAN, 12), inS: riverCurve(R_INDIAN, -12),
  deN: riverCurve(R_GERMAN, 11), deS: riverCurve(R_GERMAN, -11),
  shW: riverCurve(R_SHARED, 16), shE: riverCurve(R_SHARED, -16),
};

    const bow=new THREE.ConeGeometry(3.5,5,4); bow.rotateX(Math.PI/2); bow.scale(1,1,0.62); bow.translate(0,0.5,13.4); push(bow,M.whitePaint);

    push(new THREE.BoxGeometry(5.4,1.8,5).translate(0,1.9,6),M.woodDark);
    for(const sx of [-1,1]) push(new THREE.CylinderGeometry(1.7,1.7,1.4,14).translate(sx*2.6,0.9,-7),M.whitePaint);
  } else if(kind==='ferry'){
    push(new THREE.BoxGeometry(6.2,1.8,17).translate(0,0.4,0),M.whitePaint);
    push(new THREE.BoxGeometry(5.2,2.2,9).translate(0,2.4,-1),M.glass);
    push(new THREE.BoxGeometry(5.8,0.3,10).translate(0,3.6,-1),M.roofGrey);
    push(new THREE.BoxGeometry(3.6,1.6,3.4).translate(0,1.6,5.4),M.paleSand);
  } else if(kind==='barge'){
    push(new THREE.BoxGeometry(8.6,2.0,34).translate(0,0.3,0),M.brick);
    push(new THREE.BoxGeometry(8.6,0.5,34).translate(0,1.5,0),M.woodDark);
    for(let i=0;i<4;i++) push(new THREE.BoxGeometry(3.4,2.4,4).translate(0,2.6,-12+i*8),M.slate);
    push(new THREE.BoxGeometry(4.4,3.0,4.4).translate(0,3.2,13),M.whitePaint);
  } else {
    push(new THREE.BoxGeometry(5.4,1.6,14).translate(0,0.4,0),M.whitePaint);
    push(new THREE.BoxGeometry(4.6,1.6,7).translate(0,2.0,-1),M.glass);
    push(new THREE.BoxGeometry(5.0,0.24,8).translate(0,2.9,-1),M.roofGrey);
  }
  const bag=new GeoBag();
  for(const p of parts) bag.add(p.g, p.m);
  const grp=new THREE.Group();

    const merged=mergeGeometries(list,false);

    grp.add(mesh);
  }
  return grp;
}

function updatePeople(dt,t){

    const a=PPL.agents[i], route=a.route;
    const visible = i < PPL.N*Math.min(1,dens*0.72);
    if(!visible){ _pm.position.set(0,-500,0); _pm.scale.setScalar(0.001); _pm.updateMatrix();
      PPL.body.setMatrixAt(i,_pm.matrix); PPL.head.setMatrixAt(i,_pm.matrix); continue; }
    if(a.state==='walk'){

      const ft=a.t*route.length;
      const seg=Math.floor(ft)%route.length, nxt=(seg+1)%route.length;
      const A=route[seg]||routeEmpty, B=route[nxt]||routeEmpty;
      a.x=A.x+(B.x-A.x)*(ft-Math.floor(ft));
      a.z=A.z+(B.z-A.z)*(ft-Math.floor(ft));
      a.dir=Math.atan2(B.x-A.x,B.z-A.z);
    } else {
      a.wait-=dt;
      if(a.wait<=0){ a.state='walk'; }
    }
    const ax=a.x!==undefined?a.x:(route[0]||routeEmpty).x, az=a.z!==undefined?a.z:(route[0]||routeEmpty).z;
    const y=terrainH(ax,az);
    const bob=Math.sin(t*4.2+a.phase)*0.045;
    _pm.position.set(ax, y+bob, az);

    _pm.scale.setScalar(a.sc);

    PPL.head.setMatrixAt(i,_pm.matrix);
  }

    tr.phase=(tr.phase+dt)%(tr.len*2/tr.speed);
    const span=tr.to-tr.from;
    const u=(tr.phase*tr.speed)/span;
    const z=tr.from+((u%2)<1 ? (u%1)*span : (1-(u%1))*span);
    tr.obj.position.z=tr.z0+z;
  }
  if(ANIM.glock){
    /* glockenspiel performs for twenty seconds on each simulated hour */
    const hour=(t/120)%1;
    const n=ANIM.glock.obj.children[0];
    const playing = hour<0.055;
    ANIM.glock.obj.rotation.y = playing ? Math.sin(t*2.2)*0.12 : 0;
    ANIM.glock.obj.position.y = playing ? Math.abs(Math.sin(t*3.1))*0.10 : 0;

}

/* ============================== river sail path ============================== */
const SAIL=(()=>{
  /* A short round trip on the estuary and the two harbour reaches: out at sea,
     in past the mouth, up the Indian arm, back, up the German arm, back, and
     out again. Kept on open water so the camera never meets a bank or a
     terrace. Points are offset into the deepest water around each sample. */
  const pts=[];
  const lane=(poly, toZ)=>{
    for(let i=0;i<poly.length-1;i++){
      const [x0,z0]=poly[i], [x1,z1]=poly[i+1];
      if(z0>toZ && z1>toZ) continue;
      const dx=x1-x0, dz=z1-z0, len=Math.hypot(dx,dz)||1;
      const n=Math.max(1,Math.round(len/26));
      for(let j=0;j<n;j++){
        const t=j/n, x=lerp(x0,x1,t), z=lerp(z0,z1,t);
        if(z>toZ) continue;
        pts.push([x, z]);
      }
    }
  };
  const sharedIn=[[0,-1900],[0,-1500],[-10,-1100],[10,-700],[0,-300],[0,-40]];
  lane(sharedIn, 300);
  lane(R_INDIAN, 210);
  lane([...R_INDIAN].reverse(), 210);
  lane([...R_GERMAN].reverse(), 210);
  lane(R_GERMAN, 210);
  lane([...sharedIn].reverse(), 300);
  /* snap to the channel centre, then smooth */
  const deep=(x,z)=>{
    let bx=x, bz=z, bh=terrainH(x,z);
    for(let i=-2;i<=2;i++) for(let j=-2;j<=2;j++){
      const px=x+i*10, pz=z+j*10, hh=terrainH(px,pz);
      if(hh<bh){ bh=hh; bx=px; bz=pz; }
    }
    return [bx,bz];
  };
  const v=pts.map(([x,z])=>{ const [sx,sz]=deep(x,z); return V3(sx, 5.0, sz); });
  const curve=new THREE.CatmullRomCurve3(v,false,'catmullrom',0.10);
  return {curve, len:curve.getLength()};
})();

  const ahead=SAIL.curve.getPointAt(Math.min(0.999,u+0.014));
  /* ride a few metres above the water, lifting where the channel runs close to
     a bank so the camera never ends up inside the ground */
  camera.position.set(sailLook.x, 5.2, sailLook.z);

}

  bag.add(new THREE.BoxGeometry(4.8,0.16,(GZ0-GZ1)-18), M.waterPool, mat4(0,1.98,(GZ0+GZ1)/2));

   Things worth knowing before editing
     · Every monument is a THREE.Group placed by newMon(); geometry is merged
       into a handful of buffers per group by GeoBag, so draw calls stay low.
     · Quality only toggles fine ornament (o.fine): at Low every monument
       keeps its silhouette.
     · DECK_GROUP (the steamer deck) is a scene child, shown only when the
       camera is within 30 units of HERO_POS and sail mode is off.
     · stepTween is fed real elapsed time (rawDt) - feeding the clamped
       simulation dt makes preset flights take tens of seconds.
     · Mirrors are clones scaled (1,-1,-1) about WATER_Y; a (1,-1,1) scale
       is not a valid rotation and renders as a dark slab.
